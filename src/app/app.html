<div class="app">
  <mat-toolbar class="header">
    <span class="contents">
      <img class="logo" src="img/astrobeam-logo.png">
      <div class="title-group">
        <h4 class="title">Radiometer Control</h4>
        <span class="version">
          <span>FE v{{ appVersion }}</span>
          <span class="separator">|</span>
          <span>BE v{{ backendVersion() }}</span>
        </span>
      </div>
      <span class="spacer"></span>
      @if (auth.isAuthenticated()) {
        <button matIconButton matTooltip="Log-out" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      } 
      @else {
        <button matIconButton matTooltip="Log-In" (click)="login()">
          <mat-icon>login</mat-icon>
        </button>
        <button matIconButton matTooltip="Register" (click)="register()">
          <mat-icon>person_add</mat-icon>
        </button>
      }
    </span>
  </mat-toolbar>
  <div class="container">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
  <!-- <mat-toolbar class="footer">
  </mat-toolbar> -->
</div>
